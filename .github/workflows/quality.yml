name: "Pipeline | Automated Testing & Quality Gate"

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

jobs:
  static-analysis-and-testing:
    name: Lint, Type Check, & Test Execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Compute Quality Gate Fingerprint
        id: gate-hash
        run: |
          set -o pipefail
          HASH=$(find src/ tests/ tools/ pyproject.toml uv.lock justfile -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          echo "cache-key=quality-gate-$HASH" >> $GITHUB_OUTPUT

      - name: Verify Quality Gate Cache State
        id: cache-check
        uses: actions/cache@v6
        with:
          path: .quality-gate-passed
          key: ${{ steps.gate-hash.outputs.cache-key }}

      - name: Output Cached Quality Gate Results
        if: steps.cache-check.outputs.cache-hit == 'true'
        run: |
          echo "No changes detected in code, tests, or dependencies -- quality gate verification bypassed via cache hit." >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv Ecosystem Manager
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Just Command Runner
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: extractions/setup-just@v4

      - name: Execute Quality Verification Gates
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          just ci 2>&1 | tee quality-ci.log

      - name: Report Quality Gate Outcome
        if: steps.cache-check.outputs.cache-hit != 'true' && always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COVERAGE=$(uv run python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
            echo "Quality gate passed, coverage: ${COVERAGE}%." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f quality-ci.log ]; then
            {
              echo "Quality gate failed."
              echo ""
              echo "<details><summary>Error output</summary>"
              echo ""
              echo '```'
              uv run python -m tools.ci_summary quality-ci.log
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Quality gate failed before producing output, see the job log above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit Quality Gate Cache Marker
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: date +%s > .quality-gate-passed
